# ===================================================================
# TAQ_Restaurant - Spring Boot 3 REST API + MySQL 8 Configuration
# ===================================================================

spring.application.name=restaurant-management-system

# Server & Encoding Configuration (Embedded Tomcat, executable JAR)
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# CORS - decoupled Frontend origins (comma separated)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Jackson (JSON) - ISO-8601 dates for LocalDateTime
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Swagger UI (Optional) -> http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# MySQL 8.0 Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/taq_restaurant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=taq_user
spring.datasource.password=taq_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# SQL Seed Data Initialization (data.sql)
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# Logging
logging.level.com.university.restaurant=DEBUG
logging.level.org.springframework.security=INFO

